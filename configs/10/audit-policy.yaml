apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # Sensitive resources: log metadata only.
  # Never record Secret, ConfigMap, TokenReview or token bodies.
  - level: Metadata
    resources:
      - group: ""
        resources:
          - secrets
          - configmaps
          - serviceaccounts/token
      - group: authentication.k8s.io
        resources:
          - tokenreviews

  # Record modifications to workloads.
  - level: Request
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
    resources:
      - group: ""
        resources:
          - pods
      - group: apps
        resources:
          - deployments

  # Security-sensitive pod/service subresources.
  - level: Metadata
    resources:
      - group: ""
        resources:
          - pods/exec
          - pods/portforward
          - pods/proxy
          - services/proxy

  # Certificate creation and approval.
  - level: Metadata
    resources:
      - group: certificates.k8s.io
        resources:
          - certificatesigningrequests
          - certificatesigningrequests/approval

  # Baseline visibility for all remaining API requests.
  - level: Metadata