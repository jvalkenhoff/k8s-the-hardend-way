[Journal]
Storage=persistent
Compress=yes
Seal=yes
ForwardToSyslog=no

# Adjust these values to the size of the /var/log filesystem.
SystemMaxUse=1G
SystemKeepFree=500M
MaxRetentionSec=1month

# Limit temporary journal use before persistent storage is available.
RuntimeMaxUse=200M
RuntimeKeepFree=50M