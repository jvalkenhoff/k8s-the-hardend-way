apiVersion: kubeadm.k8s.io/v1beta4
kind: JoinConfiguration
discovery:
  bootstrapToken:
    apiServerEndpoint: 172.31.88.10:6443
    token: ${JOIN_TOKEN}
    caCertHashes:
      - sha256:${CA_HASH}
nodeRegistration:
  name: node01
  criSocket: unix:///run/containerd/containerd.sock
  kubeletExtraArgs:
    - name: node-ip
      value: 172.31.88.11