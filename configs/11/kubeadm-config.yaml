apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: 172.31.88.10
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///run/containerd/containerd.sock
  kubeletExtraArgs:
    - name: node-ip
      value: 172.31.88.10

---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v1.35.8
controlPlaneEndpoint: "172.31.88.10:6443"
apiServer:
  certSANs:
    - "172.31.88.10"
    - "controlplane"
  extraArgs:
    - name: authentication-config
      value: "/etc/kubernetes/auth/authentication-config.yaml"
    - name: authorization-mode
      value: "Node,RBAC"
    - name: enable-admission-plugins
      value: "NodeRestriction,DenyServiceExternalIPs,AlwaysPullImages,EventRateLimit"
    - name: admission-control-config-file
      value: "/etc/kubernetes/admission/admission-config.yaml"
    - name: profiling
      value: "false"
    - name: audit-policy-file
      value: "/etc/kubernetes/audit/audit-policy.yaml"
    - name: audit-log-path
      value: "/var/log/kubernetes/audit/audit.log"
    - name: audit-log-maxage
      value: "30"
    - name: audit-log-maxbackup
      value: "10"
    - name: audit-log-maxsize
      value: "100"
    - name: encryption-provider-config
      value: "/etc/kubernetes/encryption/encryption-config.yaml"
    - name: service-account-lookup
      value: "true"
    - name: service-account-extend-token-expiration
      value: "false"
    - name: tls-min-version
      value: "VersionTLS12"
    - name: tls-cipher-suites
      value: "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256"
    - name: kubelet-certificate-authority
      value: "/etc/kubernetes/pki/ca.crt"
  extraVolumes:
    - name: admission-config
      hostPath: /etc/kubernetes/admission
      mountPath: /etc/kubernetes/admission
      readOnly: true
      pathType: Directory
    - name: audit-policy
      hostPath: /etc/kubernetes/audit
      mountPath: /etc/kubernetes/audit
      readOnly: true
      pathType: Directory
    - name: audit-log
      hostPath: /var/log/kubernetes/audit
      mountPath: /var/log/kubernetes/audit
      readOnly: false
      pathType: Directory
    - name: encryption-config
      hostPath: /etc/kubernetes/encryption
      mountPath: /etc/kubernetes/encryption
      readOnly: true
      pathType: Directory
    - name: authentication-config
      hostPath: /etc/kubernetes/auth
      mountPath: /etc/kubernetes/auth
      readOnly: true
      pathType: Directory
networking:
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
  dnsDomain: cluster.local
controllerManager:
  extraArgs:
    - name: profiling
      value: "false"
    - name: use-service-account-credentials
      value: "true"
    - name: bind-address
      value: "127.0.0.1"
    - name: terminated-pod-gc-threshold
      value: "1000"
scheduler:
  extraArgs:
    - name: profiling
      value: "false"
    - name: bind-address
      value: "127.0.0.1"
etcd:
  local:
    dataDir: /var/lib/etcd
    extraArgs:
      - name: client-cert-auth
        value: "true"
      - name: peer-client-cert-auth
        value: "true"
      - name: auto-tls
        value: "false"
      - name: peer-auto-tls
        value: "false"